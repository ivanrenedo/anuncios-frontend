name: Deploy frontend

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.vscode/**'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/anuncios-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate public build variables
        run: |
          test -n "${{ vars.NEXT_PUBLIC_API_URL }}" || (echo "Missing repo variable NEXT_PUBLIC_API_URL" && exit 1)
          test -n "${{ vars.NEXT_PUBLIC_GRAPHQL_URL }}" || (echo "Missing repo variable NEXT_PUBLIC_GRAPHQL_URL" && exit 1)
          test -n "${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}" || (echo "Missing repo variable NEXT_PUBLIC_GOOGLE_CLIENT_ID" && exit 1)
          test -n "${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}" || (echo "Missing repo variable NEXT_PUBLIC_ADSENSE_CLIENT" && exit 1)

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${{ env.IMAGE }}:latest" >> "$GITHUB_OUTPUT"
          echo "${{ env.IMAGE }}:sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # NEXT_PUBLIC_* se hornean en el bundle → van como build-args.
          # Están en Variables (no Secrets) porque acaban siendo públicos
          # en cuanto sirven el JS al navegador.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_GRAPHQL_URL=${{ vars.NEXT_PUBLIC_GRAPHQL_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_ADSENSE_CLIENT=${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust droplet host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure remote directory
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p /opt/marketplace/frontend"

      - name: Upload docker-compose.yml
        run: |
          scp docker-compose.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/marketplace/frontend/docker-compose.yml

      - name: Pull image and restart frontend
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash <<'EOF'
            set -euo pipefail
            cd /opt/marketplace/frontend
            docker compose --env-file /opt/marketplace/.env pull
            docker compose --env-file /opt/marketplace/.env up -d
            docker image prune -f
          EOF
